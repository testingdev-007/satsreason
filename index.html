<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maths Mariners – Year 6 Reasoning Voyage</title>
<meta name="description" content="Year 6 SATs-style maths reasoning practice. Sail between nine islands, solve problems, earn doubloons and learn from every answer.">
<style>
:root{--ink:#1d2b3a;--sea:#0b4f7a;--sea2:#0f6fa3;--sand:#fff6dc;--sand2:#f2dfa8;--gold:#f2b705;--red:#c93545;--green:#23864f;--teal:#0e8f86;--purple:#5e43b0;--shadow:0 6px 0 rgba(8,40,66,.25),0 12px 24px rgba(8,40,66,.2)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:linear-gradient(#a6e3f7 0,#58b9e0 26%,#1f7fb3 60%,#0b4f7a 100%) fixed;min-height:100vh;line-height:1.45;padding-bottom:70px}
body::after{content:"";position:fixed;left:0;right:-60px;bottom:0;height:70px;background:repeating-radial-gradient(circle at 30px 90px,rgba(255,255,255,.2) 0 26px,transparent 27px 60px);pointer-events:none;animation:drift 14s linear infinite;z-index:0}
@keyframes drift{to{transform:translateX(-60px)}}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
h1,h2,h3{font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;margin:.2em 0 .4em;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
.topbar{position:sticky;top:0;z-index:20;background:rgba(7,44,72,.95);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.topbar .in{max-width:1000px;margin:0 auto;padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{background:none;border:0;color:#fff;font:inherit;font-family:"Palatino Linotype",Georgia,serif;font-size:1.25rem;font-weight:700;cursor:pointer;padding:4px 6px;border-radius:8px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;white-space:nowrap}
.rankbar{display:inline-block;width:70px;height:8px;background:rgba(255,255,255,.25);border-radius:6px;vertical-align:middle;margin-left:6px;overflow:hidden}
.rankbar i{display:block;height:100%;background:var(--gold)}
.wrap{max-width:1000px;margin:0 auto;padding:14px;position:relative;z-index:1}
.card{background:var(--sand);border:3px solid #d9bb73;border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card.dark{background:#0d3d5f;color:#fff;border-color:#2e86b5}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.22);font-size:1rem;min-height:44px;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.primary{background:var(--gold)}
.btn.go{background:var(--green);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid currentColor}
.btn[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:4px solid #1b6fd1;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.muted{opacity:.8;font-size:.92rem}
.polly{display:flex;gap:12px;align-items:flex-start}
.polly .bird{font-size:2.4rem;animation:bob 2.6s ease-in-out infinite}
.polly .bub{background:#fff;border-radius:16px;padding:10px 14px;border:2px solid #d9bb73;flex:1}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.isl{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--sand);border:3px solid #d9bb73;border-radius:18px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);transition:transform .15s}
.isl:hover{transform:translateY(-3px)}
.isl .em{font-size:2.2rem;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--c,#ffd166);border:3px solid rgba(0,0,0,.15)}
.isl b{display:block;font-family:"Palatino Linotype",Georgia,serif;font-size:1.15rem}
.isl small{display:block;opacity:.8;line-height:1.3}
.stars{letter-spacing:2px;color:#b47b00;font-size:1.1rem}
.stars .off{color:#c9bfa0}
.special{background:linear-gradient(135deg,#fff0b8,#ffd166)}
.special.red{background:linear-gradient(135deg,#ffd9d3,#f4a99d)}
.special.blue{background:linear-gradient(135deg,#d9ecff,#9ccbf2)}
.lvls{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.lvl{background:#fff;border:3px solid #d9bb73;border-radius:16px;padding:14px;text-align:left}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots span{width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #b79b55}
.dots .now{outline:3px solid var(--sea2);outline-offset:1px}
.dots .ok{background:var(--green);border-color:var(--green)}
.dots .half{background:var(--gold);border-color:#b47b00}
.dots .no{background:var(--red);border-color:var(--red)}
.tag{display:inline-block;background:var(--sea);color:#fff;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
.tag.m2{background:var(--purple)}
.qcard{background:var(--sand);border:3px solid #d9bb73;border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.q-text{font-size:1.2rem;margin:.4em 0}
.diagram{display:block;max-width:100%;height:auto;margin:10px auto;background:#fff;border-radius:12px;border:2px solid #e6d29b}
.diagram.sm{max-width:420px}
.answer-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:12px 0}
.fld{display:flex;flex-direction:column;gap:3px;font-weight:700}
.fld .line{display:flex;align-items:center;gap:6px;font-size:1.2rem}
.ans{font:inherit;font-size:1.3rem;padding:9px 10px;border:3px solid #b79b55;border-radius:12px;width:8.5em;max-width:100%;text-align:center;background:#fff;color:var(--ink)}
.ans.bad{border-color:var(--red);animation:shake .35s}
.ans.good{border-color:var(--green)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:12px 0}
.opt,.chip{font:inherit;font-size:1.1rem;text-align:left;background:#fff;border:3px solid #b79b55;border-radius:14px;padding:10px 14px;cursor:pointer;color:var(--ink);min-height:48px;display:flex;gap:10px;align-items:center}
.opt .ltr{background:var(--sand2);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:800;flex:none}
.opt[aria-pressed=true]{outline:4px solid var(--sea2);background:#e8f6ff}
.opt.right,.chip.right{background:#d8f5e3;border-color:var(--green)}
.opt.wrong{background:#fde1e4;border-color:var(--red)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.chip{justify-content:center;min-width:76px;font-size:1.25rem;font-weight:700}
.chip[disabled]{opacity:.35}
.seq{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:56px;padding:8px;background:#fff8e4;border:3px dashed #b79b55;border-radius:14px;margin:8px 0}
.seq .ph{opacity:.6}
.seq .chip{background:#fff3c4}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700}
.fb.ok{background:#d8f5e3;color:#0f4d2a}
.fb.no{background:#fde1e4;color:#7a1823}
.fb.info{background:#e4efff;color:#133a73}
.log{background:#fff;border-radius:12px;border:2px dashed #c9a85a;padding:10px 14px;margin-top:12px}
.log h3{margin:0 0 4px}
.log ol{margin:.3em 0 .3em 1.2em;padding:0}
.log li{margin:.25em 0}
.trap{background:#fff1d6;border-left:6px solid #e89a1d;padding:6px 10px;margin-top:8px;border-radius:6px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .12em;font-weight:700}
.fr .n{border-bottom:2px solid currentColor;padding:0 .25em}
.fr .d{padding:0 .25em}
.mx{font-weight:700;font-size:1.15em;margin-right:.05em}
.expr{font-size:1.4rem;font-weight:700;background:#fff;border-radius:10px;padding:2px 12px;display:inline-block;margin:4px 0}
.dcard{display:inline-grid;place-items:center;width:46px;height:58px;margin:3px;background:#fff;border:3px solid var(--ink);border-radius:8px;font-size:1.8rem;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.bm{display:flex;gap:3px;margin:6px 0;max-width:480px}
.bm span{flex:1;text-align:center;color:#fff;font-weight:700;padding:4px 2px;border-radius:6px;font-size:.9rem}
.tbl{border-collapse:collapse;margin:8px 0;background:#fff}
.tbl th,.tbl td{border:2px solid #8b7a45;padding:6px 14px;text-align:center}
.tbl th{background:var(--sand2)}
.big{font-size:2.6rem;text-align:center;margin:0}
.scorebig{font-family:"Palatino Linotype",Georgia,serif;font-size:2.6rem;font-weight:700;text-align:center}
.bars .bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.bars .bar .lab{width:170px;font-weight:700;font-size:.95rem}
.bars .bar .tr{flex:1;height:16px;background:#e9dcb2;border-radius:8px;overflow:hidden}
.bars .bar .tr i{display:block;height:100%;background:var(--green)}
.badges{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.badge{background:#fff;border:3px solid #d9bb73;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge .e{font-size:2rem}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:#fff;border-radius:999px;padding:2px 12px;border:2px solid #b79b55}
.timer.low{background:#ffd9d3;border-color:var(--red)}
details.rev{background:#fff;border-radius:12px;border:2px solid #e0cd92;padding:8px 12px;margin:8px 0}
details.rev summary{cursor:pointer;font-weight:700}
.confetti i{position:fixed;top:-16px;width:10px;height:14px;z-index:60;animation:fall 2.8s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
label.chk{display:flex;gap:8px;align-items:center;font-weight:700;margin:6px 0}
input[type=text].name{font:inherit;font-size:1.2rem;padding:10px 12px;border:3px solid #b79b55;border-radius:12px;max-width:100%;width:18em}
@media (max-width:520px){h1{font-size:1.6rem}.wrap{padding:10px}.card,.qcard{padding:14px}.bars .bar .lab{width:110px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<a class="skip" href="#app">Skip to the game</a>
<header class="topbar"><div class="in">
 <button class="logo" data-a="home" aria-label="Back to the treasure map">⚓ Maths Mariners</button>
 <div class="hud" id="hud" aria-live="polite"></div>
</div></header>
<main class="wrap" id="app" tabindex="-1"></main>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<script>
'use strict';
/* =====================================================================
   MATHS MARINERS – core helpers, SVG drawing, question registry
   All questions are original and generated in code, in the style of the
   KS2 reasoning papers (not copied from any past paper).
   ===================================================================== */
const R={
 int(a,b){return Math.floor(Math.random()*(b-a+1))+a;},
 pick(a){return a[Math.floor(Math.random()*a.length)];},
 shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;},
 chance(p){return Math.random()<p;},
 gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;},
 lcm(a,b){return a/R.gcd(a,b)*b;},
 divisors(n){const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d;}
};
const rd=(x,dp)=>{dp=dp==null?9:dp;const p=Math.pow(10,dp);return Math.round(x*p)/p;};
const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,',');
const f=n=>{n=rd(n,6);const neg=n<0;const p=Math.abs(n).toString().split('.');return (neg?'−':'')+grp(p[0])+(p[1]?'.'+p[1]:'');};
const gbp=n=>{n=rd(n,2);const p=Math.abs(n).toFixed(2).split('.');return (n<0?'−':'')+'£'+grp(p[0])+(p[1]==='00'?'':'.'+p[1]);};
const pad2=n=>String(n).padStart(2,'0');
const hhmm=m=>pad2(Math.floor(m/60))+':'+pad2(m%60);
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx">${w}</span>${fr(n,d)}`;
const red=(n,d)=>{const g=R.gcd(n,d);return [n/g,d/g];};
const showFrac=(n,d)=>{const r=red(n,d);n=r[0];d=r[1];if(d===1)return f(n);if(n>d)return mx(Math.floor(n/d),n%d,d);return fr(n,d);};
const NAMES=['Amir','Beth','Chloe','Dev','Ella','Femi','Grace','Harry','Isla','Jack','Kira','Leo','Mia','Noah','Olu','Priya','Quinn','Ravi','Sofia','Tom','Uma','Will','Yasmin','Zane'];
const name2=()=>R.shuffle(NAMES).slice(0,3);
const stars=n=>'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span>';

/* ---------- topics ---------- */
const TOPICS=[
 {id:'place',name:'Place Value Bay',emoji:'🏝️',color:'#ffd166',skills:'Rounding, place value, negative numbers, number lines, Roman numerals'},
 {id:'ops',name:'Four Ops Fort',emoji:'🏰',color:'#f4a261',skills:'Multi-step problems, order of operations, factors, multiples and primes, long multiplication and division'},
 {id:'frac',name:'Fraction Falls',emoji:'🌊',color:'#a8dadc',skills:'Equivalent fractions, ordering, adding, subtracting, multiplying and dividing fractions'},
 {id:'fdp',name:'Percent Port',emoji:'⚓',color:'#cdb4db',skills:'Fractions, decimals and percentages, percentages of amounts, discounts'},
 {id:'ratio',name:'Ratio Reef',emoji:'🐠',color:'#ffafcc',skills:'Sharing in a ratio, recipes, scale factors, map scales, best value'},
 {id:'alg',name:'Algebra Atoll',emoji:'🌴',color:'#b7e4c7',skills:'Substitution, formulae, missing numbers, sequences, two unknowns'},
 {id:'meas',name:'Measure Mountain',emoji:'⛰️',color:'#e9c46a',skills:'Units, time, perimeter, area, volume and conversions'},
 {id:'geom',name:'Geometry Grotto',emoji:'💎',color:'#90e0ef',skills:'Angles, shapes, coordinates, circles and 3D shapes'},
 {id:'stats',name:'Stats Shipwreck',emoji:'🦀',color:'#ffb4a2',skills:'Mean, bar charts, line graphs, pie charts and tables'}
];
const LEVELS=[{n:1,name:'Deckhand',sub:'Warm-up'},{n:2,name:'First Mate',sub:'SATs standard'},{n:3,name:'Captain',sub:'Challenge'}];

/* ---------- registry ---------- */
const GENS=[];
function G(topic,id,lvr,fn){GENS.push({topic,id,lv:lvr,fn});}
function makeQ(g,lv){const q=g.fn(lv);q.genId=g.id;q.topic=g.topic;q.lv=lv;q.marks=q.marks||1;return q;}
const num=(text,answer,o)=>Object.assign({kind:'num',text,answer},o||{});
const multi=(text,fields,o)=>Object.assign({kind:'multi',text,fields},o||{});
const timeQ=(text,mins,o)=>Object.assign({kind:'time',text,answer:mins},o||{});
const fracQ=(text,n,d,o)=>{const r=red(n,d);return Object.assign({kind:'frac',text,ansN:r[0],ansD:r[1],ansVal:r[0]/r[1],simplest:true},o||{});};
function mc(text,correct,wrongs,o){
 const all=[correct].concat(wrongs.filter(w=>w!==correct));
 const uniq=[];all.forEach(a=>{if(uniq.indexOf(a)<0)uniq.push(a);});
 const opts=R.shuffle(uniq);
 return Object.assign({kind:'mc',text,options:opts,correct:opts.indexOf(correct)},o||{});
}
const barModel=(parts)=>`<div class="bm">${parts.map((p,i)=>`<span style="flex:${p.n};background:${PAL[i%PAL.length]}">${p.label}</span>`).join('')}</div>`;

/* ---------- display of the right answer ---------- */
function ansHTML(q){
 if(q.show)return q.show;
 const un=s=>!s?'':(s==='°'||s==='%'||s==='°C'?s:' '+s);
 switch(q.kind){
  case 'num':return q.prefix==='£'?gbp(q.answer):(q.prefix||'')+f(q.answer)+un(q.suffix);
  case 'multi':return q.fields.map(x=>`${x.label}: ${x.prefix==='£'?gbp(x.answer):(x.prefix||'')+f(x.answer)}${un(x.suffix)}`).join(' &nbsp;•&nbsp; ');
  case 'mc':return q.options[q.correct];
  case 'order':return q.items.slice().sort((a,b)=>q.dir==='desc'?b.value-a.value:a.value-b.value).map(i=>i.label).join(' &nbsp;→&nbsp; ');
  case 'time':return hhmm(q.answer);
  case 'frac':return showFrac(q.ansN,q.ansD);
 }
 return '';
}

/* ---------- SVG helpers ---------- */
const INK='#1d2b3a',BLUE='#2a7fbf',TEAL='#13a89e',GOLD='#f2b705',RED='#c93545',GREEN='#2e9e5b',PURPLE='#6b4fbb',ORANGE='#f08a24';
const PAL=[BLUE,ORANGE,GREEN,PURPLE,RED,TEAL];
const svgWrap=(w,h,label,inner,cls)=>`<svg class="diagram ${cls||''}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${String(label).replace(/"/g,'&quot;')}" xmlns="http://www.w3.org/2000/svg" font-family="Trebuchet MS,Segoe UI,Arial,sans-serif">${inner}</svg>`;
const tx=(x,y,s,o)=>{o=o||{};return `<text x="${rd(x,1)}" y="${rd(y,1)}" font-size="${o.size||14}" text-anchor="${o.anchor||'middle'}" fill="${o.fill||INK}"${o.bold?' font-weight="700"':''}${o.rot?` transform="rotate(${o.rot} ${rd(x,1)} ${rd(y,1)})"`:''}>${s}</text>`;};
const ln=(x1,y1,x2,y2,o)=>{o=o||{};return `<line x1="${rd(x1,1)}" y1="${rd(y1,1)}" x2="${rd(x2,1)}" y2="${rd(y2,1)}" stroke="${o.stroke||INK}" stroke-width="${o.w||2}"${o.dash?` stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;};

function svgBar(data,o){
 const W=470,H=290,m={l:50,r:12,t:18,b:44},pw=W-m.l-m.r,ph=H-m.t-m.b,n=data.length,gap=pw/n,bw=gap*0.6;
 let s='';
 for(let v=0;v<=o.max;v+=o.step){const y=m.t+ph-(v/o.max)*ph;s+=ln(m.l,y,W-m.r,y,{stroke:'#c9d6df',w:1})+tx(m.l-6,y+4,v,{anchor:'end',size:12});}
 s+=ln(m.l,m.t,m.l,m.t+ph)+ln(m.l,m.t+ph,W-m.r,m.t+ph);
 data.forEach((d,i)=>{const x=m.l+gap*i+(gap-bw)/2;
  if(d.value!=null){const h=(d.value/o.max)*ph;s+=`<rect x="${rd(x,1)}" y="${rd(m.t+ph-h,1)}" width="${rd(bw,1)}" height="${rd(h,1)}" fill="${PAL[i%PAL.length]}" rx="3"/>`;}
  else s+=`<rect x="${rd(x,1)}" y="${m.t+10}" width="${rd(bw,1)}" height="${ph-10}" fill="none" stroke="${INK}" stroke-dasharray="5 4" rx="3"/>`+tx(x+bw/2,m.t+ph/2,'?',{size:26,bold:1});
  s+=tx(x+bw/2,m.t+ph+18,d.label,{size:12});});
 if(o.yTitle)s+=tx(13,m.t+ph/2,o.yTitle,{size:12,rot:-90});
 return svgWrap(W,H,o.alt||'Bar chart',s);
}
function svgLine(pts,o){
 const W=480,H=290,m={l:52,r:18,t:18,b:46},pw=W-m.l-m.r,ph=H-m.t-m.b,n=pts.length;
 const X=i=>m.l+(n===1?pw/2:pw*i/(n-1)),Y=v=>m.t+ph-((v-o.min)/(o.max-o.min))*ph;
 let s='';
 for(let v=o.min;v<=o.max;v+=o.step){s+=ln(m.l,Y(v),W-m.r,Y(v),{stroke:v===0?INK:'#c9d6df',w:v===0?2:1})+tx(m.l-7,Y(v)+4,f(v),{anchor:'end',size:12});}
 s+=ln(m.l,m.t,m.l,m.t+ph);
 pts.forEach((p,i)=>{s+=ln(X(i),m.t,X(i),m.t+ph,{stroke:'#e4ecf1',w:1})+tx(X(i),m.t+ph+18,p.label,{size:12});});
 s+=`<polyline fill="none" stroke="${BLUE}" stroke-width="3" points="${pts.map((p,i)=>rd(X(i),1)+','+rd(Y(p.value),1)).join(' ')}"/>`;
 pts.forEach((p,i)=>{s+=`<circle cx="${rd(X(i),1)}" cy="${rd(Y(p.value),1)}" r="5" fill="${ORANGE}" stroke="${INK}" stroke-width="1.5"/>`;});
 if(o.yTitle)s+=tx(13,m.t+ph/2,o.yTitle,{size:12,rot:-90});

/* ---------- number / fraction / time parsing ---------- */
function parseVal(s){s=String(s).trim().replace(/,/g,'').replace(/[£$€]/g,'').replace(/[−–]/g,'-').trim();let m;
 if(m=s.match(/^(-?\d*\.?\d+)\s*[a-z°%²³ ]*$/i))return parseFloat(m[1]);
 if(m=s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/)){const w=+m[1],b=+m[3];if(!b)return NaN;return (w<0?-1:1)*(Math.abs(w)+(+m[2])/b);}
 if(m=s.match(/^(-?\d+)\s*\/\s*(\d+)$/)){if(!+m[2])return NaN;return +m[1]/+m[2];}
 return NaN;}
function parseFrac(s){s=String(s).trim().replace(/[−–]/g,'-');let m;
 if(m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/)){const w=+m[1],a=+m[2],b=+m[3];if(!b)return null;return {type:'mixed',n:w*b+a,d:b,a:a,b:b};}
 if(m=s.match(/^(\d+)\s*\/\s*(\d+)$/)){const n=+m[1],d=+m[2];if(!d)return null;return {type:'frac',n:n,d:d};}
 if(/^\d+$/.test(s))return {type:'whole',n:+s,d:1};
 if(/^\d*\.\d+$/.test(s))return {type:'dec',n:parseFloat(s),d:1};
 return null;}
function parseTime(s){s=String(s).trim().toLowerCase().replace(/\./g,':');let m;
 if(m=s.match(/^(\d{1,2}):?(\d{2})\s*(am|pm)$/)){const h=(+m[1])%12+(m[3]==='pm'?12:0);if(+m[1]>12||+m[2]>59)return null;return {mins:h*60+ +m[2],ampm:true};}
 if((m=s.match(/^(\d{1,2}):(\d{2})$/))||(m=s.match(/^(\d{2})(\d{2})$/))){if(+m[1]>23||+m[2]>59)return null;return {mins:+m[1]*60+ +m[2]};}
 return null;}

/* ---------- building question sets ---------- */
const qkey=q=>q.text+'|'+(q.svg?q.svg.length:0);
function gensFor(topic,lv){let c=GENS.filter(g=>g.topic===topic&&g.lv[0]<=lv&&lv<=g.lv[1]);if(!c.length){c=GENS.filter(g=>g.topic===topic).sort((a,b)=>Math.abs(a.lv[0]-lv)-Math.abs(b.lv[0]-lv)).slice(0,3);}return c;}
function gen(g,lv,seen){let q;for(let t=0;t<25;t++){q=makeQ(g,Math.min(Math.max(lv,g.lv[0]),g.lv[1]));if(!q||!q.text)continue;if(!seen||!seen.has(qkey(q)))break;}if(seen)seen.add(qkey(q));return q;}
function buildIsland(topic,lv,n){const gs=gensFor(topic,lv),seen=new Set(),out=[];let pool=[];
 for(let i=0;i<n;i++){if(!pool.length)pool=R.shuffle(gs);out.push(gen(pool.pop(),lv,seen));}
 return out;}
function buildMock(){const order=['ops','frac','fdp','place','ratio','alg','meas','geom','stats'];const extra=R.shuffle(['ops','frac','fdp','meas','geom','ratio','alg']).slice(0,3);
 const topics=R.shuffle(order.concat(extra)),lvs=[1,1,1,2,2,2,2,2,3,3,3,3],seen=new Set();
 return topics.map((t,i)=>gen(R.pick(gensFor(t,lvs[i])),lvs[i],seen));}
function buildReview(){const ents=Object.keys(S.weak).map(id=>Object.assign({id:id},S.weak[id])).sort((a,b)=>b.n-a.n).slice(0,8),seen=new Set(),out=[];
 ents.forEach(e=>{const g=GENS.find(x=>x.id===e.id);if(g)out.push(gen(g,e.lv,seen));});return out;}

<div class="grid">
<button class="isl special" data-a="storm"><span class="em" aria-hidden="true" style="background:#fff">⚡</span><span><b>Storm Challenge</b><small>A mixed mock paper: 12 questions that get harder, one go each, just like the real thing.${S.best.mock?` Best: ${S.best.mock}%`:''}</small></span></button>

</div>`);}
function islandScreen(id){const t=TOPICS.find(x=>x.id===id),st=S.stars[id]||[0,0,0];hud();
 app(`<div class="card"><button class="btn ghost" data-a="home" style="color:var(--ink)">⬅ Back to the map</button>
<div class="polly" style="margin-top:12px"><div class="bird" aria-hidden="true">${t.emoji}</div><div class="bub"><h1>${t.name}</h1><p>${t.skills}.</p><p class="muted">Each voyage has 8 questions. You get two tries on each one, and a captain's log explains every answer.</p></div></div></div>
<div class="lvls">${LEVELS.map(l=>`<div class="lvl"><h3>Level ${l.n} – ${l.name}</h3><p class="muted">${l.sub}</p><p class="stars" aria-label="${st[l.n-1]} of 3 stars">${stars(st[l.n-1])}</p><button class="btn go" data-a="start" data-id="${id}" data-lv="${l.n}">Start voyage ⛵</button></div>`).join('')}</div>`);}
function cabin(){hud();const earned=BADGES.filter(b=>S.badges[b.id]).length;
 app(`<div class="card"><button class="btn ghost" data-a="home" style="color:var(--ink)">⬅ Back to the map</button><h1 style="margin-top:12px">Captain's Cabin</h1>
<p>You have <b>${S.stats.answered}</b> questions answered, <b>${S.stats.correct}</b> correct. Best streak: <b>${S.stats.bestStreak}</b>.</p>
<h2>Badges (${earned} of ${BADGES.length})</h2><div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b.id]?'':'locked'}"><span class="e" aria-hidden="true">${b.e}</span><span><b>${b.n}</b><br><small>${b.d}</small></span></div>`).join('')}</div>
<h2 style="margin-top:18px">Settings</h2>
<label class="chk"><input type="checkbox" data-a="toggleSound" ${S.sound?'checked':''}> Sound effects</label>
<label class="chk"><input type="checkbox" data-a="toggleTimer" ${S.timer?'checked':''}> Show a timer in the Storm Challenge</label>
<div class="row" style="margin-top:10px"><button class="btn" data-a="rename">✏️ Change pirate name</button><button class="btn danger" data-a="reset">🗑️ Reset all progress</button></div>
<p class="muted">Everything is saved only in this browser on this computer. Nothing is sent anywhere.</p></div>`);}

/* ---------- quiz ---------- */
function begin(mode,topic,lv){
 let qs=[];
 if(mode==='island')qs=buildIsland(topic,lv,8);else if(mode==='mock')qs=buildMock();else qs=buildReview();
 if(!qs.length){home();return;}
 const marks=qs.reduce((s,q)=>s+q.marks,0);
 Q={mode:mode,topic:topic,lv:lv,qs:qs,i:0,pts:0,coins:0,streak:0,maxStreak:0,res:[],start:Date.now(),marks:marks,got:0,rank0:rankOf(S.coins),q:null,done:false,limit:mode==='mock'&&S.timer?marks*70:0};
 if(mode==='island')S.stats.visited[topic]=true;
 showQ();}
function modeLabel(){if(Q.mode==='mock')return '⚡ Storm Challenge';if(Q.mode==='review')return '🔧 Mend the Sails';const t=TOPICS.find(x=>x.id===Q.topic);return `${t.emoji} ${t.name} · ${LEVELS[Q.lv-1].name}`;}
function dotsHTML(){return `<div class="dots" aria-hidden="true">${Q.qs.map((q,i)=>`<span class="${i===Q.i?'now ':''}${Q.res[i]?Q.res[i].state:''}"></span>`).join('')}</div>`;}
function inputHTML(q){
 const fld=(id,label,pre,suf,neg)=>`<label class="fld">${label?`<span>${esc(label)}</span>`:'<span class="vh">Your answer</span>'}<span class="line">${pre?`<span>${pre}</span>`:''}<input class="ans" id="${id}" type="text" inputmode="${neg?'text':'decimal'}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc(label||'Your answer')}">${suf?`<span>${esc(suf)}</span>`:''}</span></label>`;
 switch(q.kind){
  case 'num':return `<div class="answer-row">${fld('a0','Your answer',q.prefix||'',q.suffix||'',q.answer<0)}</div>`;
  case 'multi':return `<div class="answer-row">${q.fields.map((x,i)=>fld('a'+i,x.label,x.prefix||'',x.suffix||'',x.answer<0)).join('')}</div>`;
  case 'frac':return `<div class="answer-row"><label class="fld"><span>Your answer</span><span class="line"><input class="ans" id="a0" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. 3/4" style="width:9em" aria-label="Your answer as a fraction"></span></label></div>`;
  case 'time':return `<div class="answer-row"><label class="fld"><span>Your answer</span><span class="line"><input class="ans" id="a0" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. 14:35" style="width:7em" aria-label="Your answer as a time"></span></label></div>`;
  case 'mc':return `<div class="opts" role="group" aria-label="Answer choices">${q.options.map((o,i)=>`<button class="opt" data-a="pick" data-i="${i}" aria-pressed="false"><span class="ltr" aria-hidden="true">${'ABCDEF'[i]}</span><span>${o}</span></button>`).join('')}</div>`;
  case 'order':return orderHTML(q);
 }return '';}
function orderHTML(q){return `<div class="chips" role="group" aria-label="Choices to put in order">${q.items.map((it,i)=>`<button class="chip" data-a="chip" data-i="${i}" ${Q.seq.indexOf(i)>=0?'disabled':''}>${it.label}</button>`).join('')}</div>
<div class="muted">Your order (${q.dir==='asc'?'smallest first':'largest first'}) – tap an item to take it back out:</div>
<div class="seq" id="seq">${Q.seq.length?Q.seq.map((i,p)=>`<button class="chip" data-a="unchip" data-p="${p}" aria-label="Item ${p+1}">${q.items[i].label}</button>`).join(''):'<span class="ph">Nothing chosen yet</span>'}</div>`;}
function showQ(){
 const q=Q.qs[Q.i];Q.q=q;Q.tries=0;Q.hint=false;Q.done=false;Q.sel=null;Q.seq=[];
 const t=TOPICS.find(x=>x.id===q.topic),mock=Q.mode==='mock';
 app(`<div class="card dark" style="padding:10px 14px"><div class="qhead" style="margin:0"><button class="btn ghost" data-a="quit" style="color:#fff;min-height:36px;padding:4px 12px">✕ Leave</button><div><b>${modeLabel()}</b><br><span class="muted">Question ${Q.i+1} of ${Q.qs.length}</span></div>${dotsHTML()}<div class="row"><span class="pill" id="streak" ${Q.streak>=2?'':'hidden'}>🔥 ${Q.streak}</span><span class="pill">🪙 +${Q.coins}</span>${Q.limit?'<span class="timer" id="timer" role="timer" aria-live="off">--:--</span>':''}</div></div></div>
<div class="qcard"><div class="row sp"><span class="tag ${q.marks>1?'m2':''}">${q.marks} mark${q.marks>1?'s':''}</span><span class="muted">${t.emoji} ${t.name}</span></div>
<div class="q-text">${q.text}</div>${q.svg||''}
<div id="inputArea">${inputHTML(q)}</div>
<div class="row"><button class="btn go" id="checkBtn" data-a="check">Check ✔</button>${mock?'':'<button class="btn" id="hintBtn" data-a="hint">💡 Hint</button>'}</div>
<div id="fb" aria-live="polite"></div><div id="log"></div><div id="nextRow" style="margin-top:12px"></div></div>`,true);
 window.scrollTo(0,0);
 if(Q.limit&&!timerId){tick();timerId=setInterval(tick,1000);}else if(Q.limit)tick();
 try{if(!('ontouchstart' in window)){const i=$('#a0');if(i)i.focus();}}catch(e){}}
function tick(){const el=$('#timer');if(!el||!Q||!Q.limit)return;const rem=Q.limit-Math.floor((Date.now()-Q.start)/1000),a=Math.abs(rem),s=`${Math.floor(a/60)}:${pad2(a%60)}`;el.textContent=(rem<0?'+':'⏱ ')+s;el.classList.toggle('low',rem<120);}
function setFB(cls,html){$('#fb').innerHTML=`<div class="fb ${cls}">${html}</div>`;}
function evaluate(q){
 const val=id=>($(id)?$(id).value:'').trim();
 switch(q.kind){
  case 'num':{const v=val('#a0');if(!v)return {soft:'Type your answer first.'};const n=parseVal(v);if(isNaN(n))return {soft:'Type your answer as a number.'};return {ok:Math.abs(n-q.answer)<=1e-6*Math.max(1,Math.abs(q.answer))};}
  case 'multi':{let ok=true;for(let i=0;i<q.fields.length;i++){const v=val('#a'+i);if(!v)return {soft:'Fill in every box.'};const n=parseVal(v);if(isNaN(n))return {soft:'Type your answers as numbers.'};if(Math.abs(n-q.fields[i].answer)>1e-6*Math.max(1,Math.abs(q.fields[i].answer)))ok=false;}return {ok:ok};}
  case 'frac':{const v=val('#a0');if(!v)return {soft:'Type your answer first.'};const p=parseFrac(v);if(!p)return {soft:'Write your answer as a fraction like 3/4 (or a mixed number like 1 1/2).'};
   if(Math.abs(p.n/p.d-q.ansVal)>1e-9)return {ok:false};
   if(p.type==='dec')return {soft:'That is the right value – now write it as a fraction.'};
   if(q.form==='improper'&&p.type==='mixed')return {soft:'Right value! Now give it as an improper (top-heavy) fraction like 11/4.'};
   if(q.form==='mixed'&&p.type==='frac'&&p.n>p.d)return {soft:'Right value! Now give it as a mixed number like 2 1/4.'};
   if(q.simplest){if(p.type==='frac'&&p.d!==1&&R.gcd(p.n,p.d)!==1)return {soft:'That is the right value, but can the fraction be simplified further?'};if(p.type==='mixed'&&R.gcd(p.a,p.b)!==1)return {soft:'That is the right value, but can the fraction part be simplified further?'};if(p.type==='frac'&&p.d===1)return {ok:true};}
   return {ok:true};}
  case 'time':{const v=val('#a0');if(!v)return {soft:'Type the time first.'};const p=parseTime(v);if(!p)return {soft:'Write the time like 14:35.'};if(p.mins===q.answer)return {ok:true};if(!p.ampm&&p.mins+720===q.answer)return {soft:'Use the 24-hour clock – for example 2:35 pm is 14:35.'};return {ok:false};}
  case 'mc':if(Q.sel==null)return {soft:'Choose an answer first.'};return {ok:Q.sel===q.correct};
  case 'order':{if(Q.seq.length<q.items.length)return {soft:'Put every item in order first.'};const idx=q.items.map((_,i)=>i).sort((a,b)=>q.dir==='desc'?q.items[b].value-q.items[a].value:q.items[a].value-q.items[b].value);return {ok:Q.seq.every((v,i)=>q.items[v].value===q.items[idx[i]].value)};}
 }return {ok:false};}
function lockInputs(correct){const q=Q.q;document.querySelectorAll('#inputArea input').forEach(i=>{i.disabled=true;i.classList.add(correct?'good':'bad');});
 if(q.kind==='mc'){document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('right');else if(i===Q.sel)b.classList.add('wrong');});}
 if(q.kind==='order'){document.querySelectorAll('#inputArea .chip').forEach(b=>b.disabled=true);}
 $('#checkBtn').hidden=true;const h=$('#hintBtn');if(h)h.hidden=true;}
function resolve(correct){
 const q=Q.q,first=Q.tries===1,mock=Q.mode==='mock';Q.done=true;
 let c=0,state='no';
 S.stats.answered++;
 if(correct){S.stats.correct++;state=first||mock?'ok':'half';
  if(mock)c=q.marks*3;else c=first&&!Q.hint?q.marks*5:first?q.marks*3:q.marks*2;
  if(first){Q.streak++;if(Q.streak>Q.maxStreak)Q.maxStreak=Q.streak;if(Q.streak>=3&&!mock)c+=2;}else Q.streak=0;
  Q.pts+=first||mock?1:.5;Q.got+=q.marks;
  const w=S.weak[q.genId];if(w){w.n--;if(w.n<=0){delete S.weak[q.genId];S.stats.mended++;}}
  sfx.ok();
 }else{Q.streak=0;const w=S.weak[q.genId];S.weak[q.genId]={lv:q.lv,n:(w?w.n:0)+1,topic:q.topic};sfx.no();}
 if(Q.maxStreak>S.stats.bestStreak)S.stats.bestStreak=Q.maxStreak;
 Q.coins+=c;S.coins+=c;Q.res[Q.i]={q:q,state:state,tries:Q.tries};save();hud();
 lockInputs(correct);
 let msg;
 if(correct)msg=mock?`✔ Correct! +${q.marks} mark${q.marks>1?'s':''}`:`🦜 ${first?R.pick(QUIP_OK):'Got it on the second try – well done!'} <b>+${c} 🪙</b>${Q.streak>=3?` &nbsp;🔥 Streak bonus!`:''}`;
 else msg=mock?`✖ Not this time. The answer was <b>${ansHTML(q)}</b>`:`🦜 ${R.pick(QUIP_MISS)}<br>The answer is <b>${ansHTML(q)}</b>`;
 setFB(correct?'ok':'no',msg);
 $('#log').innerHTML=`<div class="log"><h3>📜 Captain's log – how it works</h3><ol>${q.explain.map(e=>`<li>${e}</li>`).join('')}</ol>${q.trap?`<div class="trap">⚠️ ${q.trap}</div>`:''}</div>`;
 const last=Q.i>=Q.qs.length-1;
 $('#nextRow').innerHTML=`<button class="btn primary" id="nextBtn" data-a="next">${last?'See my results 🏆':'Next question ➜'}</button>`;
 const dots=document.querySelector('.dots');if(dots)dots.outerHTML=dotsHTML();
 const st=$('#streak');if(st){st.hidden=Q.streak<2;st.textContent='🔥 '+Q.streak;}
 try{$('#nextBtn').focus({preventScroll:true});$('#nextBtn').scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}}

/* ---------- results ---------- */
function reviewList(){return Q.res.map((r,i)=>`<details class="rev"><summary>${r.state==='ok'?'✔':r.state==='half'?'◐':'✖'} Question ${i+1} <span class="muted">(${r.q.marks} mark${r.q.marks>1?'s':''} · ${esc(TOPICS.find(t=>t.id===r.q.topic).name)})</span></summary><div class="q-text">${r.q.text}</div>${r.q.svg||''}<p><b>Answer:</b> ${ansHTML(r.q)}</p><div class="log"><ol>${r.q.explain.map(e=>`<li>${e}</li>`).join('')}</ol></div></details>`).join('');}
function newBadgesHTML(list){return list.length?`<div class="fb info">🏅 New badge${list.length>1?'s':''}: ${list.map(id=>{const b=BADGES.find(x=>x.id===id);return `<b>${b.e} ${b.n}</b>`;}).join(' &nbsp; ')}</div>`:'';}
function finish(){stopTimer();const newB=[];S.stats.voyages++;let html;
 const rankUp=rankOf(S.coins)>Q.rank0?`<div class="fb ok">🎉 Rank up! You are now a <b>${RANKS[rankOf(S.coins)][1]}</b> ${RANKS[rankOf(S.coins)][2]}</div>`:'';
 if(Q.maxStreak>=5)award('streak5',newB);
 if(Q.mode==='mock'){
  const pct=Math.round(Q.got/Q.marks*100);S.stats.mocks++;if(pct>S.best.mock)S.best.mock=pct;award('mock',newB);if(pct>=80)award('mock80',newB);
  const by={};Q.res.forEach(r=>{const k=r.q.topic;by[k]=by[k]||{got:0,tot:0};by[k].tot+=r.q.marks;if(r.state==='ok')by[k].got+=r.q.marks;});
  const keys=Object.keys(by).sort((a,b)=>by[a].got/by[a].tot-by[b].got/by[b].tot),weakest=keys.filter(k=>by[k].got<by[k].tot).slice(0,2);
  const secs=Math.floor((Date.now()-Q.start)/1000);
  const msg=pct>=85?'Brilliant sailing! You are really exam-ready.':pct>=65?'Strong work! A little more practice on the tricky islands and you will be flying.':pct>=45?'A good start. Use Mend the Sails and the islands below to build up your confidence.':'Don\'t worry – every voyage teaches you something. Read the captain\'s logs and try again.';
  html=`<div class="card"><p class="big" aria-hidden="true">⚡</p><h1 style="text-align:center">Storm Challenge complete!</h1><div class="scorebig">${Q.got} / ${Q.marks} marks</div><p style="text-align:center;font-size:1.3rem"><b>${pct}%</b> · time ${Math.floor(secs/60)}:${pad2(secs%60)}</p><p style="text-align:center">${msg}</p>
<p style="text-align:center"><b>+${Q.coins} 🪙</b> earned</p>${rankUp}${newBadgesHTML(newB)}
<h2>How you did by topic</h2><div class="bars">${keys.map(k=>`<div class="bar"><span class="lab">${TOPICS.find(t=>t.id===k).emoji} ${TOPICS.find(t=>t.id===k).name}</span><span class="tr"><i style="width:${Math.round(by[k].got/by[k].tot*100)}%"></i></span><span>${by[k].got}/${by[k].tot}</span></div>`).join('')}</div>
${weakest.length?`<p>To improve, sail to: ${weakest.map(k=>`<button class="btn" data-a="island" data-id="${k}">${TOPICS.find(t=>t.id===k).emoji} ${TOPICS.find(t=>t.id===k).name}</button>`).join(' ')}</p>`:'<p>🌟 Every topic was spot on!</p>'}
<div class="row"><button class="btn primary" data-a="storm">New Storm Challenge ⚡</button>${Object.keys(S.weak).length?'<button class="btn" data-a="mend">🔧 Mend the Sails</button>':''}<button class="btn" data-a="home">Back to the map</button></div></div>
<div class="card"><h2>Review every question</h2>${reviewList()}</div>`;
  if(pct>=65){sfx.win();confetti();}
 }else if(Q.mode==='review'){
  html=`<div class="card"><p class="big" aria-hidden="true">🔧</p><h1 style="text-align:center">Sails mended!</h1><div class="scorebig">${sfmt(Q.pts)} / ${Q.qs.length}</div><p style="text-align:center"><b>+${Q.coins} 🪙</b> earned. ${Object.keys(S.weak).length?`You still have ${Object.keys(S.weak).length} weak spot${Object.keys(S.weak).length>1?'s':''} – get them right to clear them.`:'All weak spots fixed! 🎉'}</p>${rankUp}${newBadgesHTML(newB)}
<div class="row" style="justify-content:center">${Object.keys(S.weak).length?'<button class="btn primary" data-a="mend">Mend more 🔧</button>':''}<button class="btn" data-a="home">Back to the map</button></div></div><div class="card"><h2>Review every question</h2>${reviewList()}</div>`;
  if(S.stats.mended>=5)award('mender',[]);
 }else{
  const n=Q.qs.length,s=Q.pts>=n*.9?3:Q.pts>=n*.75?2:Q.pts>=n*.5?1:0,perfect=Q.res.every(r=>r.state==='ok'),bonus=s*10+(perfect?20:0);
  const old=(S.stats&&S.stars[Q.topic])||[0,0,0],cur=old.slice();if(s>cur[Q.lv-1])cur[Q.lv-1]=s;S.stars[Q.topic]=cur;
  S.coins+=bonus;Q.coins+=bonus;award('first',newB);if(perfect)award('perfect',newB);if(Q.lv===3&&s===3)award('captain3',newB);
  if(Object.keys(S.stats.visited).length>=9)award('explorer',newB);if(S.stats.mended>=5)award('mender',newB);if(S.coins>=1000)award('rich',newB);
  const rk=rankOf(S.coins)>Q.rank0?`<div class="fb ok">🎉 Rank up! You are now a <b>${RANKS[rankOf(S.coins)][1]}</b> ${RANKS[rankOf(S.coins)][2]}</div>`:'';
  const t=TOPICS.find(x=>x.id===Q.topic),title=s===3?'Treasure found!':s===2?'Great voyage!':s===1?'Land ahoy!':'Back to port – try again!';
  const msg=s===3?'Superb! Maximum stars.':s>=1?'Well done. Aim for more stars next time!':'Read the captain\'s logs below, then have another go – you will get there.';
  html=`<div class="card"><p class="big" aria-hidden="true">${s?'🏆':'⚓'}</p><h1 style="text-align:center">${title}</h1><p style="text-align:center">${t.emoji} ${t.name} · Level ${Q.lv} – ${LEVELS[Q.lv-1].name}</p><div class="scorebig">${sfmt(Q.pts)} / ${n}</div><p class="stars" style="text-align:center;font-size:2rem" aria-label="${s} of 3 stars">${stars(s)}</p><p style="text-align:center">${msg}</p>
<p style="text-align:center"><b>+${Q.coins} 🪙</b> earned${bonus?` (including a ${bonus} 🪙 bonus${perfect?' for a perfect voyage':''})`:''}</p>${rk}${newBadgesHTML(newB)}
<div class="row" style="justify-content:center"><button class="btn primary" data-a="start" data-id="${Q.topic}" data-lv="${Q.lv}">Sail again ⛵</button>${Q.lv<3?`<button class="btn go" data-a="start" data-id="${Q.topic}" data-lv="${Q.lv+1}">Next level ➜</button>`:''}${Object.keys(S.weak).length?'<button class="btn" data-a="mend">🔧 Mend the Sails</button>':''}<button class="btn" data-a="home">Back to the map</button></div></div>
<div class="card"><h2>Review every question</h2>${reviewList()}</div>`;
  if(s>=2){sfx.win();confetti();}
 }
 save();hud();Q.q=null;app(html);}

/* ---------- actions ---------- */
const A={
 home(){home();},
 rndName(){const n=R.pick(['Red','Salty','Swift','Brave','Clever','Golden','Stormy','Lucky','Silver','Wild'])+' '+R.pick(['Parrot','Anchor','Compass','Dolphin','Cutlass','Barnacle','Kraken','Telescope','Seagull','Lantern']);$('#nm').value=n;},
 setName(){const v=($('#nm').value||'').trim().slice(0,18);S.name=v||'Mystery Sailor';save();home();},
 rename(){const v=prompt('Choose a new pirate name (please not your real name):',S.name);if(v!=null){S.name=v.trim().slice(0,18)||S.name;save();cabin();}},
 island(d){islandScreen(d.id);},
 start(d){begin('island',d.id,+d.lv);},
 storm(){begin('mock');},
 mend(){if(!Object.keys(S.weak).length){app(`<div class="card"><h1>Nothing to mend yet!</h1><p>When you miss a question, it is saved here so you can practise new versions of it later. Sail to an island first.</p><button class="btn primary" data-a="home">Back to the map</button></div>`);return;}begin('review');},
 cabin(){cabin();},
 toggleSound(){S.sound=!S.sound;save();if(S.sound)sfx.ok();},
 toggleTimer(){S.timer=!S.timer;save();},
 reset(){if(confirm('Reset ALL your progress, doubloons and badges? This cannot be undone.')){try{localStorage.removeItem(KEY);}catch(e){}S=defaults();home();}},
 quit(){if(confirm('Leave this voyage? You will keep the doubloons you have won so far, but not the stars.')){stopTimer();Q=null;home();}},
 pick(d){if(!Q||Q.done)return;Q.sel=+d.i;document.querySelectorAll('.opt').forEach((b,i)=>b.setAttribute('aria-pressed',i===Q.sel?'true':'false'));},
 chip(d){if(!Q||Q.done)return;Q.seq.push(+d.i);$('#inputArea').innerHTML=orderHTML(Q.q);},
 unchip(d){if(!Q||Q.done)return;Q.seq.splice(+d.p,1);$('#inputArea').innerHTML=orderHTML(Q.q);},
 hint(){if(!Q||Q.done)return;Q.hint=true;setFB('info','💡 <b>Hint:</b> '+(Q.q.hint||'Read the question again and underline the key numbers.'));},
 check(){if(!Q||!Q.q||Q.done)return;const q=Q.q,r=evaluate(q);if(r.soft){setFB('info','🦜 '+r.soft);return;}
  Q.tries++;
  if(r.ok){resolve(true);return;}
  if(Q.mode==='mock'||Q.tries>=2){resolve(false);return;}
  setFB('no','🦜 '+R.pick(QUIP_RETRY)+' <span class="muted">(one more try – the hint button can help)</span>');sfx.no();
  if(q.kind==='mc'){const b=document.querySelectorAll('.opt')[Q.sel];if(b){b.classList.add('wrong');b.disabled=true;b.setAttribute('aria-pressed','false');}Q.sel=null;}
  else if(q.kind==='order'){Q.seq=[];$('#inputArea').innerHTML=orderHTML(q);}
  else{document.querySelectorAll('#inputArea input').forEach(i=>{i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');});const first=$('#a0');if(first)first.focus();}},
 next(){if(!Q||!Q.done)return;Q.i++;if(Q.i>=Q.qs.length)finish();else showQ();}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;if(b.tagName==='INPUT')return;const fn=A[b.dataset.a];if(fn)fn(b.dataset,b);});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.tagName==='INPUT'&&t.type==='checkbox'&&t.dataset.a&&A[t.dataset.a])A[t.dataset.a]();});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'){const nm=$('#nm');if(nm&&document.activeElement===nm){e.preventDefault();A.setName();return;}
  if(!Q||!Q.q)return;if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();if(Q.done)A.next();else A.check();}
 else if(Q&&Q.q&&!Q.done&&Q.q.kind==='mc'&&/^[1-6]$/.test(e.key)&&!(e.target&&e.target.tagName==='INPUT')){const i=+e.key-1;if(i<Q.q.options.length&&!document.querySelectorAll('.opt')[i].disabled)A.pick({i:i});}});
load();hud();home();
</script>
